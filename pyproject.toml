[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gpxfoto"
version = "0.1.0"
description = "Geotag photos from a GPX track without changing the image"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
gpxfoto = "gpxfoto.cli:main"

[tool.setuptools.packages.find]
include = ["gpxfoto*"]

[tool.setuptools.package-data]
gpxfoto = ["web/*.*", "web/vendor/*.*", "web/vendor/maplibre-gl/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
